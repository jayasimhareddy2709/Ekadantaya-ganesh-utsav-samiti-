<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Ekadantaya Ganesh Utsav Samiti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .premium-festival-bg {
            background: radial-gradient(circle at 50% 15%, #3d050c 0%, #1a0205 60%, #0a0001 100%);
            min-height: 100vh;
            position: relative;
        }
        .premium-festival-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 10% 30%, rgba(245, 158, 11, 0.08) 0%, transparent 35%),
                radial-gradient(circle at 90% 70%, rgba(245, 158, 11, 0.08) 0%, transparent 35%);
            pointer-events: none;
        }
        .royal-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(251, 191, 36, 0.2);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .royal-card:hover {
            border-color: rgba(251, 191, 36, 0.5);
            box-shadow: 0 25px 50px -10px rgba(251, 191, 36, 0.25);
            transform: translateY(-6px);
        }
        .gold-glow {
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
        }
    </style>
</head>
<body class="premium-festival-bg text-gray-100 font-sans overflow-x-hidden selection:bg-amber-500 selection:text-black">

    <!-- Header Layout -->
    <header class="bg-gradient-to-b from-[#4a0610] to-[#220206] text-white py-8 px-4 shadow-2xl border-b border-amber-500/30 sticky top-0 z-50 backdrop-blur-xl bg-opacity-95">
        <div class="max-w-6xl mx-auto flex flex-col items-center justify-center gap-6 text-center relative">
            <div class="relative group">
                <div class="absolute -inset-1.5 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 rounded-full blur opacity-75 shadow-[0_0_25px_rgba(245,158,11,0.5)]"></div>
                <img src="logo.png" onerror="this.style.display='none';" class="relative w-24 h-24 md:w-28 md:h-28 rounded-full border-2 border-amber-300 object-cover bg-white" alt="Ekadantaya Logo">
            </div>
            <div>
                <h1 class="text-3xl md:text-5xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-100 to-amber-400 gold-glow">Team Ekadantaya Ganesh Utsav Samiti</h1>
                <p class="text-amber-400/90 mt-2 text-sm md:text-base font-bold tracking-wider flex items-center justify-center gap-2">
                    <i class="fa-solid fa-location-dot text-rose-500 animate-pulse"></i> Bhagya Nagar 2nd Cross, Anantapur
                </p>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-12 space-y-12 relative z-10">
        
        <!-- Pillars & Venue of the Utsav -->
        <section class="royal-card p-6 rounded-3xl">
            <h2 class="text-2xl font-black text-amber-400 mb-8 flex items-center gap-3 border-b border-white/10 pb-4 tracking-wide gold-glow">
                <i class="fa-solid fa-hands-praying text-xl text-amber-500"></i> Pillars & Venue of the Utsav
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Idol Donor -->
